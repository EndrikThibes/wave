<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="Wave: ouça música em ondas. Projeto acadêmico de Desenvolvimento de Interface de Usuário (UDESC Alto Vale)." />
    <meta name="theme-color" content="#05070d" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="preload" href="/fonts/sora-latin-wght-normal.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/manrope-latin-wght-normal.woff2" as="font" type="font/woff2" crossorigin />
    <title>Wave</title>
    <script>
      try {
        var tema = localStorage.getItem("wave:tema");
        if (tema === "light" || tema === "dark") {
          document.documentElement.setAttribute("data-theme", tema);
        }
      } catch (erro) {}
    </script>
  </head>
  <body>
    <div id="raiz"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
